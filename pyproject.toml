[project]
name = "mini-rainbow"
version = "0.1.0"
description = "Production-grade modular Deep Q-Learning system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # RL environment
    "gymnasium[atari]>=1.0.0,<2.0.0",
    "ale-py>=0.10.0",
    # Config (omegaconf comes with hydra-core)
    "hydra-core>=1.3.2",
    # Numerics
    "numpy>=1.24.0",
    # PyTorch: install separately for your CUDA version (see Makefile / RUNBOOK)
    # e.g.: uv pip install torch --index-url https://download.pytorch.org/whl/cu126
]

[project.optional-dependencies]
# W&B experiment tracking (training only, graceful fallback if missing)
wandb = ["wandb>=0.16.0"]
# Inference API server + demo
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "Pillow>=10.0.0",
]
# Evaluation video recording
video = ["moviepy>=1.0.3,<2.0.0"]
# Everything except PyTorch
all = [
    "mini-rainbow[wandb,api,video]",
]
# Development tools
dev = [
    "mini-rainbow[all]",
    "pytest>=7.0",
    "ruff>=0.2.0",
    "black>=24.0",
    "isort>=5.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
