[project]
name = "mini-rainbow"
version = "0.1.0"
description = "Production-grade modular Deep Q-Learning system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # RL & environments
    "gymnasium[atari,accept-rom-license]>=0.29.1",
    "ale-py>=0.9.0",
    "shimmy[atari]>=1.3.0",
    # Deep learning (user installs PyTorch separately for their CUDA version)
    # e.g.: uv pip install torch --index-url https://download.pytorch.org/whl/cu121
    # Config
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    # Logging
    "wandb>=0.16.0",
    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    # Video recording
    "moviepy>=1.0.3,<2.0.0",
    # Utilities
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.2.0",
    "black>=24.0",
    "isort>=5.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
