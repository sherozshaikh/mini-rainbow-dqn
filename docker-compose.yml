services:
  platform:
    build:
      context: .
      dockerfile: mini_rainbow/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEVICE=cpu

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./mini_rainbow/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - platform

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./mini_rainbow/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
